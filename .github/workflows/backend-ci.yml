name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:backend